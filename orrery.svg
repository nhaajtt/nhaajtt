<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="t d">
<title id="t">Orrery of nhaajtt</title>
<desc id="d">nhaajtt: 3 public repositories, 0 stars, 0 followers, mostly JavaScript. Each planet is a public repository. Newer pushes orbit closer to the sun and each language has its own fill symbol.</desc>
<style>
  :root { --paper: #0d2f6b; --ink: #eaf1ff; --dim: #a9bde6; --grid: #eaf1ff; --sun: #f2d16b; }
  @media (prefers-color-scheme: light) { :root { --paper: #f4f7fb; --ink: #0d2f6b; --dim: #4d648f; --grid: #0d2f6b; --sun: #e0ac1a; } }
  text { font-family: 'Sofia Sans Extra Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif; font-stretch: condensed; fill: var(--ink); }
  .name { font-size: 46px; font-weight: 800; letter-spacing: -0.5px; }
  .handle { font-size: 16px; fill: var(--dim); }
  .head { font-size: 13px; fill: var(--dim); }
  .row { font-size: 17px; font-weight: 600; }
  .lang { font-size: 14px; fill: var(--dim); }
  .note { font-size: 13px; fill: var(--dim); }
  .cv { font-size: 24px; font-weight: 800; }
  .ck { font-size: 12px; fill: var(--dim); }
  .grid { stroke: var(--grid); stroke-opacity: .09; stroke-width: 1; }
  .rule { stroke: var(--ink); stroke-opacity: .28; stroke-width: 1; }
  .frame { fill: none; stroke: var(--ink); stroke-opacity: .55; }
  .ring { fill: none; stroke: var(--ink); stroke-opacity: .34; stroke-width: 1; }
  .axis { stroke: var(--ink); stroke-opacity: .16; stroke-width: 1; stroke-dasharray: 2 4; }
  .tick { fill: none; stroke: var(--ink); stroke-opacity: .5; stroke-width: 1; }
  .sunline { fill: none; stroke: var(--sun); }
</style>
<defs>
<pattern id="sy-hatch-up" patternUnits="userSpaceOnUse" width="3.2" height="3.2" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="3.2" stroke="var(--ink)" stroke-width="1"/></pattern><pattern id="sy-hatch-down" patternUnits="userSpaceOnUse" width="3.2" height="3.2" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="3.2" stroke="var(--ink)" stroke-width="1"/></pattern><pattern id="sy-cross" patternUnits="userSpaceOnUse" width="3.2" height="3.2" patternTransform="rotate(45)"><path d="M0 0V3.2M0 0H3.2" stroke="var(--ink)" stroke-width="0.9" fill="none"/></pattern><pattern id="sy-lines" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(0)"><line x1="0" y1="0" x2="0" y2="3.4" stroke="var(--ink)" stroke-width="1"/></pattern><pattern id="sy-bars" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(90)"><line x1="0" y1="0" x2="0" y2="3.4" stroke="var(--ink)" stroke-width="1"/></pattern><pattern id="sy-dots" patternUnits="userSpaceOnUse" width="3.6" height="3.6"><circle cx="1.8" cy="1.8" r="0.8" fill="var(--ink)"/></pattern><pattern id="sy-target" patternUnits="userSpaceOnUse" width="8" height="8"><circle cx="4" cy="4" r="2.6" fill="none" stroke="var(--ink)" stroke-width="0.9"/><circle cx="4" cy="4" r="0.8" fill="var(--ink)"/></pattern><linearGradient id="sy-half" x1="0" x2="1" y1="0" y2="0"><stop offset="0.5" stop-color="var(--ink)"/><stop offset="0.5" stop-color="var(--paper, transparent)"/></linearGradient>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path class="grid" d="M20 0H0V20" fill="none"/></pattern>
</defs>
<rect width="880" height="440" rx="6" fill="var(--paper)"/>
<rect width="880" height="440" rx="6" fill="url(#grid)"/>
<rect class="frame" x="10" y="10" width="860" height="420" stroke-width="1.4"/>
<rect class="frame" x="16" y="16" width="848" height="408" stroke-width="0.6"/>
<text class="name" x="40" y="72">Nhaajt</text>
<text class="handle" x="40" y="96">@nhaajtt</text>
<text class="head" x="40" y="136">Public repositories</text>
<line class="rule" x1="40" y1="168" x2="304" y2="168"/><circle cx="50" cy="158" r="6.5" fill="var(--paper, transparent)" stroke="var(--ink)" stroke-width="1.2"/><circle cx="50" cy="158" r="6.5" fill="url(#sy-hatch-up)" stroke="var(--ink)" stroke-width="1.2"/><text class="row" x="68" y="162">orrery</text><text class="lang" x="304" y="162" text-anchor="end">JavaScript</text><line class="rule" x1="40" y1="198" x2="304" y2="198"/><circle cx="50" cy="188" r="6.5" fill="var(--paper, transparent)" stroke="var(--ink)" stroke-width="1.2"/><text class="row" x="68" y="192">nhaajtt</text><text class="lang" x="304" y="192" text-anchor="end">no language</text><line class="rule" x1="40" y1="228" x2="304" y2="228"/><circle cx="50" cy="218" r="6.5" fill="var(--paper, transparent)" stroke="var(--ink)" stroke-width="1.2"/><text class="row" x="68" y="222">sandbox</text><text class="lang" x="304" y="222" text-anchor="end">no language</text>
<text class="head" x="40" y="348">How to read this sheet</text><text class="note" x="40" y="363">Orbit: how recently a repository was pushed.</text><text class="note" x="40" y="378">Size: stars and repository size.</text><text class="note" x="40" y="393">Fill symbol: the main language.</text>
