name: Quote

on:
  schedule:
    - cron: "5 17 * * *" # midnight in Vietnam
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-commits
  cancel-in-progress: false

jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pick today's line
        run: python3 .github/scripts/quote.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Today's line"
          git pull --rebase -q origin main
          git push
